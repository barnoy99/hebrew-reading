<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#6b4bb8">
<title>אליה קוראת</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<div id="sparkles" aria-hidden="true"></div>

<!-- ============ בית ============ -->
<section id="screen-home" class="screen active">
  <header class="home-head">
    <button id="parent-gate" class="parent-gate" aria-label="הורים">·</button>
    <div class="hello"><span class="mascot">🦄</span><span id="hello-text">שלום!</span></div>
  </header>

  <div id="garden" class="garden"></div>

  <nav class="modes">
    <button class="mode" data-mode="write">
      <span class="mode-icon">✏️</span><span class="mode-label">כותבת אותיות</span>
    </button>
    <button class="mode" data-mode="listen">
      <span class="mode-icon">👂</span><span class="mode-label">שומעת ובוחרת</span>
    </button>
    <button class="mode" data-mode="hunt">
      <span class="mode-icon">🔍</span><span class="mode-label">ציד אותיות</span>
    </button>
    <button class="mode" data-mode="read">
      <span class="mode-icon">🗣️</span><span class="mode-label">קוראת בקול</span>
    </button>
  </nav>

  <p id="no-voice" class="no-voice hidden">
    🔇 אין קול בעברית במכשיר הזה — אפשר עדיין לשחק בציד אותיות
  </p>
</section>

<!-- ============ סבב משחק ============ -->
<section id="screen-round" class="screen">
  <button class="back" data-back aria-label="חזרה">↩</button>
  <div id="progress" class="progress"></div>
  <div id="round-body" class="round-body"></div>
</section>

<!-- ============ חגיגה ============ -->
<div id="celebrate" class="overlay hidden">
  <div class="celebrate-card">
    <div id="celebrate-gift" class="gift">🌸</div>
    <div id="celebrate-text" class="celebrate-text">כל הכבוד!</div>
    <div id="celebrate-unlock" class="unlock-note hidden"></div>
    <button id="celebrate-ok" class="primary">➜</button>
  </div>
</div>

<!-- ============ הורים ============ -->
<div id="parent" class="overlay hidden">
  <div class="parent-card">
    <h2>מסך הורים</h2>
    <div id="parent-voice" class="parent-voice"></div>
    <h3>שליטה באותיות</h3>
    <div id="parent-mastery" class="mastery-grid"></div>
    <h3>אותיות פתוחות</h3>
    <div id="parent-letters" class="toggle-grid"></div>
    <h3>ניקוד פתוח</h3>
    <div id="parent-vowels" class="toggle-grid"></div>
    <div class="parent-actions">
      <button id="parent-close" class="primary">סגירה</button>
      <button id="parent-studio" class="ghost">🎙 אולפן הקלטות</button>
      <button id="parent-reset" class="danger">איפוס הכל</button>
    </div>
  </div>
</div>

<!-- ============ אולפן הקלטות ============ -->
<div id="studio" class="overlay hidden">
  <div class="studio-card">
    <h2>🎙 אולפן הקלטות</h2>
    <p class="studio-note">
      הקול שלך תמיד עדיף על הקול הממוחשב. הקליטו מה שנשמע לא טוב —
      ההקלטה נשמרת במכשיר ומשמשת מיד. כדי שתעבוד בכל המכשירים, לחצו על ייצוא.
    </p>
    <div class="studio-bar">
      <span id="studio-count"></span>
      <span class="grow"></span>
      <button id="studio-export" class="ghost">⬇ ייצוא</button>
      <button id="studio-close" class="primary">סגירה</button>
    </div>
    <div id="studio-list" class="studio-list"></div>
  </div>
</div>

<!-- ?v= is bumped on every deploy. Without it the browser keeps serving the
     old JS from cache and the tablet needs a manual hard-refresh to update. -->
<script src="data.js?v=5"></script>
<script src="strokes.js?v=5"></script>
<script src="clips.js?v=5"></script>
<script src="audio.js?v=5"></script>
<script src="engine.js?v=5"></script>
<script src="write.js?v=5"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js?v=5"></script>
<script src="sync.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סדר כתיבת האותיות — לבדיקה</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { font-family:Rubik, Arial, sans-serif; background:#f6f3fb; color:#2c1a4d;
         margin:0; padding:20px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p  { color:#6b5b8c; margin:0 0 16px; font-size:15px; line-height:1.6; max-width:70ch; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
  .cell { background:#fff; border-radius:18px; padding:10px; text-align:center;
          box-shadow:0 2px 8px rgba(60,28,110,.10); }
  .cell h2 { font-size:15px; margin:0 0 6px; font-weight:500; }
  .cell .id { font-family:monospace; font-size:12px; color:#9a8bb8; }
  canvas { display:block; margin:0 auto; border-radius:12px; background:#fdfcff; }
  .bar { position:sticky; top:0; background:#f6f3fb; padding:10px 0; z-index:2; }
  button { font-family:inherit; font-size:15px; padding:9px 16px; border:none; cursor:pointer;
           border-radius:12px; background:#7c5cd6; color:#fff; }
</style>
</head>
<body>

<div class="bar">
  <h1>סדר כתיבת האותיות — לבדיקה</h1>
  <p>
    כל אות מצוירת לפי הסדר שהוגדר בקובץ <code>strokes.js</code>. העיגול הצהוב הוא נקודת
    ההתחלה של כל קו, והמספר הוא סדר הקווים. <b>אם סדר או כיוון כלשהו לא נכון — תגידו לי
    איזו אות, ואתקן.</b> זה בדיוק מה שהאפליקציה תדרוש מאליה, ולכן חשוב שיהיה נכון.
  </p>
  <button id="replay">▶ הצג שוב</button>
</div>

<div class="grid" id="grid"></div>

<script src="data.js"></script>
<script src="strokes.js"></script>
<script>
const SIZE = 170, BOX = SIZE * 0.78, ORIGIN = (SIZE - BOX) / 2;
const toPx = p => ({ x: ORIGIN + p[0]/100*BOX, y: ORIGIN + p[1]/100*BOX });
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

function along(pts, f) {
  const segs = [];
  let total = 0;
  for (let i=1;i<pts.length;i++){ const d=dist(pts[i-1],pts[i]); segs.push(d); total+=d; }
  let want = total*Math.min(1,f), acc=0; const upto=[];
  for (let i=0;i<segs.length;i++){
    if (acc+segs[i] >= want){
      const k = segs[i] ? (want-acc)/segs[i] : 0;
      return { p:{ x:pts[i].x+(pts[i+1].x-pts[i].x)*k, y:pts[i].y+(pts[i+1].y-pts[i].y)*k }, upto };
    }
    acc+=segs[i]; upto.push(pts[i+1]);
  }
  return { p:pts[pts.length-1], upto:upto.slice(0,-1) };
}

const cells = [];

function makeCell(letter) {
  const ref = STROKES[letter.id];
  if (!ref) return;
  const wrap = document.createElement('div');
  wrap.className = 'cell';
  wrap.innerHTML = '<h2>' + letter.ch + ' — ' + letter.name +
                   ' <span class="id">' + letter.id + '</span></h2>';
  const cv = document.createElement('canvas');
  const dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = SIZE*dpr; cv.height = SIZE*dpr;
  cv.style.width = SIZE+'px'; cv.style.height = SIZE+'px';
  const ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);
  wrap.appendChild(cv);
  document.getElementById('grid').appendChild(wrap);

  const cell = { ctx, ref, ch: letter.ch, i:0, t:0, trail:[], raf:null };
  cells.push(cell);
  return cell;
}

function guide(ctx, ch) {
  ctx.clearRect(0,0,SIZE,SIZE);
  ctx.save();
  ctx.font = '500 ' + (BOX*0.95) + 'px Rubik, Arial, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(60,30,110,.12)';
  ctx.fillText(ch, SIZE/2, SIZE/2);
  ctx.restore();
}

function frame(c) {
  c.t += 0.03;
  if (c.t >= 1) { c.trail.push(c.ref[c.i].map(toPx)); c.i++; c.t = 0; }
  guide(c.ctx, c.ch);
  const ctx = c.ctx;
  ctx.save();
  ctx.strokeStyle = '#37c07a'; ctx.lineWidth = 9;
  ctx.lineCap='round'; ctx.lineJoin='round';
  c.trail.forEach(pts => {
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    pts.slice(1).forEach(p => ctx.lineTo(p.x,p.y)); ctx.stroke();
  });
  if (c.i < c.ref.length) {
    const pts = c.ref[c.i].map(toPx);
    const at = along(pts, c.t);
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    at.upto.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.lineTo(at.p.x, at.p.y); ctx.stroke();
    // yellow start dot for the stroke in progress
    ctx.fillStyle='#ffd257'; ctx.strokeStyle='#a07b00'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, 11, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#5a4200'; ctx.font='bold 13px Rubik, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(c.i+1), pts[0].x, pts[0].y);
    // moving pen
    ctx.fillStyle='#1e7a4a';
    ctx.beginPath(); ctx.arc(at.p.x, at.p.y, 8, 0, 7); ctx.fill();
  }
  ctx.restore();
  if (c.i < c.ref.length) c.raf = requestAnimationFrame(()=>frame(c));
  else c.raf = setTimeout(()=>{ c.i=0; c.t=0; c.trail=[]; frame(c); }, 1400);
}

LETTERS.forEach(l => { const c = makeCell(l); if (c) frame(c); });

document.getElementById('replay').onclick = () => {
  cells.forEach(c => { cancelAnimationFrame(c.raf); clearTimeout(c.raf);
                       c.i=0; c.t=0; c.trail=[]; frame(c); });
};
</script>
</body>
</html>
